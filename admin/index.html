<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · Association Al Jiwar</title>
<link rel="icon" href="/assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="/admin/admin.css?v=7">
</head>
<body>
  <section id="login" class="login" hidden>
    <div class="login-rings" aria-hidden="true"><span></span><span></span><span></span></div>
    <form class="login-box">
      <img src="/assets/img/logo-md.png" alt="Association Al Jiwar" width="150">
      <h1>Espace admin</h1>
      <p class="sub">Modifiez les textes et les photos du site.</p>
      <label>Mot de passe <input type="password" name="password" autocomplete="current-password" required autofocus></label>
      <button class="btn primary big" type="submit">Se connecter</button>
      <p class="err" role="alert"></p>
    </form>
  </section>

  <section id="app" class="app" hidden>
    <aside class="side">
      <a class="side-brand" href="/" target="_blank" rel="noopener"><img src="/assets/img/symbol.png" alt="" width="38"><span>Al Jiwar<small>Administration</small></span></a>
      <nav id="tabs" class="side-nav"></nav>
      <div class="side-end">
        <a class="side-link" href="/" target="_blank" rel="noopener"><span class="i">↗</span>Voir le site</a>
        <a id="history" class="side-link" href="#" target="_blank" rel="noopener" hidden><span class="i">↺</span>Historique</a>
        <button id="logout" class="side-link" type="button"><span class="i">⎋</span>Se déconnecter</button>
      </div>
    </aside>
    <div class="main">
      <header class="head">
        <button id="menu" class="menu" type="button" aria-label="Menu">☰</button>
        <div class="head-t"><h1 id="title"></h1><p id="hint" class="hint"></p></div>
        <div class="head-r">
          <div id="langs" class="seg" role="group" aria-label="Langue affichée">
            <button data-l="all" type="button">Toutes</button><button data-l="fr" type="button">FR</button><button data-l="ar" type="button">ع</button><button data-l="en" type="button">EN</button>
          </div>
          <button id="undo" class="btn" type="button" hidden>Annuler</button>
          <a id="preview" class="btn" href="/" target="_blank" rel="noopener">Aperçu ↗</a>
          <button id="save" class="btn primary" type="button" disabled><span class="dot"></span><span class="lbl">Enregistré</span></button>
        </div>
      </header>
      <main id="panel" class="panel"></main>
    </div>
    <div id="toast" class="toast" role="status"></div>
  </section>
<script src="/admin/admin.js?v=7"></script>
</body>
</html>
